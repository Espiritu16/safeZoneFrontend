<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SafeZone - Sistema de Gestión y Protección de Víctimas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma confidencial para denunciar y dar seguimiento a casos de violencia familiar. Atención profesional, alias anónimo y línea de ayuda 24/7.">
  <meta name="theme-color" content="#1E3A8A">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tipografia: Inter global; JetBrains Mono solo para codigos e identificadores -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">

  <!-- Iconografía: Material Symbols Rounded (legacy) y Outlined (modal login) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-25..200&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

  <style>
    /* ─── Material Symbols Rounded helper ────────────────────────────────
       Uso:  <span class="icon">shield</span>
              <span class="icon icon--lg icon--filled">verified</span>
       Tamaños: icon--sm 18 / icon--md 24 / icon--lg 32 / icon--xl 48 / icon--2xl 72 / icon--hero 160
    */
    .icon {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'liga';
      user-select: none;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .icon--filled { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
    .icon--thin   { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    .icon--sm     { font-size: 18px; }
    .icon--md     { font-size: 24px; }
    .icon--lg     { font-size: 32px; }
    .icon--xl     { font-size: 48px; }
    .icon--2xl    { font-size: 72px; }
    .icon--hero   { font-size: 160px; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
