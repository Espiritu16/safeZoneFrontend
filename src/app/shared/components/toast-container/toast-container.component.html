<div class="sz-toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="sz-toast animate-fade-in">
      <div class="sz-toast-icon" [ngClass]="{
        'is-success': toast.type === 'success',
        'is-error': toast.type === 'error',
        'is-warning': toast.type === 'warning',
        'is-info': toast.type === 'info'
      }">
        @if (toast.type === 'success') {
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
        } @else if (toast.type === 'warning') {
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        } @else if (toast.type === 'info') {
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        } @else {
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        }
      </div>
      <div class="sz-toast-content">{{ toast.text }}</div>
      <button class="sz-toast-close" (click)="toastService.remove(toast.id)">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  }
</div>
