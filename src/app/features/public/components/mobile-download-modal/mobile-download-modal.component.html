@if (open) {
  <div class="download-modal-shell" role="presentation" (click)="close()">
    <div class="download-modal-backdrop" aria-hidden="true"></div>

    <section
      class="download-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="download-modal-title"
      (click)="$event.stopPropagation()"
    >
      <button class="download-modal-close" type="button" aria-label="Cerrar modal" (click)="close()">
        <span class="material-symbols-outlined">close</span>
      </button>

      <header class="download-modal-header">
        <span class="material-symbols-outlined download-modal-icon" aria-hidden="true">download_for_offline</span>
        <p class="download-modal-kicker">Aplicación móvil SafeZone</p>
        <h2 id="download-modal-title">Descarga la app para tu dispositivo</h2>
        <p>Android está disponible como APK de prueba para instalar directamente en tu celular.</p>
      </header>

      <div class="download-options" aria-label="Opciones de descarga móvil">
        <article class="download-option is-available">
          <div class="download-option-head">
            <span class="material-symbols-outlined platform-icon android-icon" aria-hidden="true">android</span>
            <div>
              <h3>Android</h3>
              <p>Instala el APK directamente en tu celular Android.</p>
            </div>
          </div>
          <a class="download-action" [href]="androidApkUrl" download="safezone-android.apk">
            Descargar APK
            <span class="material-symbols-outlined" aria-hidden="true">download</span>
          </a>
        </article>

      </div>
    </section>
  </div>
}
