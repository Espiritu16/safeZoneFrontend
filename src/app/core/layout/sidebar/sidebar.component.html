<aside class="sz-sidebar" [ngClass]="{'is-open': layoutService.isMobileSidebarOpen()}">
  <div class="sz-sidebar-brand">
    <div class="sz-sidebar-logo-icon">
      <span class="material-symbols-outlined">shield_person</span>
    </div>
    <h5>SAFEZONE</h5>
    <small>Gestión interna</small>
  </div>

  <nav class="sz-sidebar-nav">
    <a class="sz-sidebar-nav-item" routerLink="/dashboard" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">grid_view</span>Panel
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/denuncias" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">edit_document</span>Denuncias
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/casos" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">groups</span>Casos
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/victimas" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">health_and_safety</span>Víctimas
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/citas" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">calendar_month</span>Citas
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/evidencias" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">upload_file</span>Evidencias
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/reportes" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">monitoring</span>Reportes
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/auditoria" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">history</span>Auditoría
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/usuarios" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">manage_accounts</span>Usuarios
    </a>
    <a class="sz-sidebar-nav-item" routerLink="/configuracion" routerLinkActive="is-active" (click)="layoutService.closeMobileSidebar()">
      <span class="material-symbols-outlined">settings</span>Configuración
    </a>
  </nav>

  <div class="sz-sidebar-footer">
    <div class="sz-sidebar-session">
      <div>Usuario Demo</div>
      <small>{{ authService.currentRole() }}</small>
    </div>
    <button class="sz-sidebar-footer-logout" (click)="logout()" title="Cerrar sesión">
      <span class="material-symbols-outlined">logout</span>Salir
    </button>
  </div>
</aside>
