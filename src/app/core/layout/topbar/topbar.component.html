<header class="sz-header" [ngClass]="{'is-collapsed': layoutService.isSidebarCollapsed()}">
  <div>
    <button class="sz-header-menu-toggle" type="button" aria-label="Abrir menú" (click)="layoutService.toggleMobileSidebar()">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <div class="sz-header-title-block">
      <h5>Sistema de Gestión SafeZone</h5>
      <small>Centro de atención y trazabilidad</small>
    </div>
  </div>

  <div class="sz-header-actions">
    <span class="sz-header-safe-badge">
      <span class="material-symbols-outlined">verified_user</span>
      <small>Operación interna segura</small>
    </span>

    <div class="sz-header-profile">
      <div class="sz-header-profile-avatar">{{ userInitials() }}</div>
      <div class="sz-header-profile-info">
        <strong>{{ authService.nombre() || 'Usuario SafeZone' }}</strong>
        <small>{{ authService.currentRole() }}</small>
      </div>
    </div>
  </div>
</header>
